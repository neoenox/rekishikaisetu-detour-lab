# English edition (independent project).
# This is NOT read by the Japanese channel's scripts. Do not merge into ../channel.toml.

[channel]
name = "The Detour Lab"
handle = "@detour-lab"
tagline = "Follow the small questions"
about = "The Detour Lab checks the things you think you know, using real sources and simple math."
